plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Must match rootProject.name and mod_id; the jar is <mod_id>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests compile against main but are never part of it, so the jar cannot
// ship them. Declared before neoForge because the mods block joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless verification: boots GameTestServer, runs every @GameTest, exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Joined so @GameTestHolder is discovered in dev runs; still not jarred.
            sourceSet sourceSets.gametest
        }
    }
}

// Expands the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml, so mod identity is edited in gradle.properties only.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Passing the provider as a source dir also wires the generation order.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The junit CI check refuses to pass an empty suite, so this stays wired in
// every derived repo.
repositories {
    mavenCentral()

    // Tensura: Reincarnated and the FTB Quests stack resolve from
    // CurseMaven by exact Curse project + file id - pinned, never floating
    // (the *_file_id values live in gradle.properties).
    maven {
        name = 'CurseMaven'
        url = uri('https://cursemaven.com')
        content { includeGroup 'curse.maven' }
    }

    // Sympathetic Jobs (+ Attributes) resolve from Modrinth's own maven,
    // pinned versions - they ride as transitive POM dependencies of
    // tensura_quests and are never staged as jars for this repo's runs
    // (optional families in that mod).
    maven {
        name = 'ModrinthMaven'
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }

    // infinite-dungeon-api, same transitive reason as Modrinth above - the
    // owning repository differs, so it needs its own GitHub Packages block.
    maven {
        name = 'GitHubPackagesDungeon'
        url = uri('https://maven.pkg.github.com/HexaHexes/infinite-dungeon-api')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }

    // tensura_quests and tensura_quests_api, from their owning repositories
    // on GitHub Packages (a workflow token cannot read another repo's
    // packages: CI injects PACKAGE_READ_TOKEN as GITHUB_TOKEN on the Gradle
    // steps; locally supply gpr.user / gpr.key). GitHub answers 404 when
    // credentials are missing for a package read.
    maven {
        name = 'GitHubPackagesTensuraQuests'
        url = uri('https://maven.pkg.github.com/HexaHexes/tensura-quests')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    maven {
        name = 'GitHubPackagesTensuraQuestsApi'
        url = uri('https://maven.pkg.github.com/HexaHexes/tensura-quests-api')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
}

configurations {
    // Runtime closure for the GameTest run: staged into run/mods by
    // prepareGametestMods, exactly like the rest of the org's mod repos.
    gametestMods
}

// The mod's required dependency closure (what neoforge.mods.toml declares):
// Tensura: Reincarnated with its required closure, the FTB Quests stack it
// hosts on, and the tensura_quests pair the chapters are written against.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Tensura: Reincarnated and its required closure - file ids are
    // CurseMaven coordinates (project id above each value in
    // gradle.properties).
    gametestMods "curse.maven:architectury-419699:${architectury_file_id}"
    gametestMods "curse.maven:cloth-config-348521:${cloth_config_file_id}"
    gametestMods "curse.maven:geckolib-388172:${geckolib_file_id}"
    gametestMods "curse.maven:manascore-619025:${manascore_file_id}"
    gametestMods "curse.maven:smartbrainlib-661293:${smartbrainlib_file_id}"
    gametestMods "curse.maven:tensura-reincarnated-643695:${tensura_file_id}"
    gametestMods "curse.maven:terrablender-940057:${terrablender_file_id}"

    // The FTB Quests stack (ftbquests declares ftblibrary/ftbteams
    // required, so they stage as jars alongside it).
    gametestMods 'curse.maven:ftb-quests-289412:8885017' // ftb-quests-neoforge-2101.1.36
    gametestMods 'curse.maven:ftb-library-forge-404465:9008089' // ftb-library-neoforge-2101.1.37
    gametestMods 'curse.maven:ftb-teams-404468:8724782' // ftb-teams-neoforge-2101.1.11

    // The task and reward types the chapters use, plus the api artifact
    // tensura_quests declares required.
    gametestMods "org.bitwisemadness.tensuraquests:tensura_quests:${tensura_quests_version}"
    gametestMods "org.bitwisemadness.tensuraquestsapi:tensura_quests_api:${tensura_quests_api_version}"
}

// Stage the runtime closure into run/mods for the GameTest server: Sync
// keeps the folder exact, so stale jars from older pins are removed too.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary: the task's exit code is not a reliable
// signal. Keep expectedTests in sync with the @GameTest methods.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 1
    dependsOn 'prepareGametestMods'
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// release.yml tags, publish.yml drives this block. Keep the URL pointing at
// THIS repository; local publishes may set gpr.user / gpr.key.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-questlines')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// The `static` CI job is the gate for all three. SpotBugs and Checkstyle ride
// Gradle's `check` graph too; Spotless stays out of it by design. Rationale and
// the shared-filter rules live in agents/AGENTS.md.
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
